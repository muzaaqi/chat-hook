# Configuration version (Do not change)
config-version: 4

# Webhook URL to send Minecraft chat to
webhook-url: "http://localhost:3001/api/chat/minecraft-webhook"

# Web server settings for receiving chat from website
web-server:
  port: 8081
  
# Secret key to authenticate requests between server and website
enable-secret-key: true
secret-key: "YOUR_SECRET_KEY"

# IP whitelist for incoming webhooks from website
enable-ip-whitelist: false
ip-whitelist:
  - "127.0.0.1"
  - "0.0.0.0"

# Dynamic source labels
source_tags:
  web: "WEB"
  discord: "DISCORD"
  minecraft: "MC"

# Format for Minecraft → Web/Discord messages
# Placeholders: {source}, {group}, {player}, {message}
message_format: "[{source}] [{group}] - {player} » {message}"

# Format for in-game Minecraft chat display (supports color codes & LuckPerms prefix)
# Placeholders: {prefix}, {group}, {player}, {message}
ingame_format: "{prefix}{player} » {message}"

# If PlaceholderAPI is installed, use it for in-game prefix/placeholder resolution
use_placeholderapi: false
