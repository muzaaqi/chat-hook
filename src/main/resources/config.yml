# Configuration version (Do not change)
config-version: 2

# Webhook URL to send Minecraft chat to
webhook-url: "http://localhost:8080/api/minecraft-chat"

# Web server settings for receiving chat from website
web-server:
  port: 8081
  
# Secret key to authenticate requests between server and website
enable-secret-key: true
secret-key: "YOUR_SECRET_KEY"

# IP whitelist for incoming webhooks from website
enable-ip-whitelist: false
ip-whitelist:
  - "127.0.0.1"
  - "0.0.0.0"

# Message format for chat sent from Minecraft to in-game display
# Available placeholders:
#   {source}  - Always "MC" for Minecraft messages
#   {group}   - Player's LuckPerms primary group (uppercase)
#   {player}  - Player's username or realname
#   {message} - The chat message content
message_format: "[{source}] [{group}] - {player} » {message}"

# Source label for Minecraft messages
source_label: "MC"
